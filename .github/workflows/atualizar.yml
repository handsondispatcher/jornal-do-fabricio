name: Atualizar Jornal

on:
  workflow_dispatch:
  schedule:
    - cron: '*/30 * * * *'

permissions:
  contents: write

jobs:
  publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Coletar notícias e gerar site
        run: |
          python -c 'import engine; print(engine.collect())'
          python build_site.py
      - name: Publicar arquivos atualizados
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html noticias.csv version.json thumbnails/
          git diff --cached --quiet || (git commit -m 'Atualização automática do jornal' && git push)
